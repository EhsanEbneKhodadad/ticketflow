name: ticketflow
x-backend-env: &backend-env
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  Storage__Endpoint: http://storage:8333
  Storage__Bucket: ticketflow-attachments
  Storage__Region: us-east-1
  Storage__AccessKey: ${S3_ACCESS_KEY_ID:?Copy .env.example to .env}
  Storage__SecretKey: ${S3_SECRET_ACCESS_KEY:?Copy .env.example to .env}
  Mail__Host: mailpit
  Mail__Port: 1025
  App__PublicUrl: http://localhost:3000
  ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Copy .env.example to .env};Username=${POSTGRES_USER:?Copy .env.example to .env};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env}
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  storage:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      S3_BUCKET: ticketflow-attachments
    ports: ["127.0.0.1:8333:8333"]
    volumes: [storage-data:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: [search-data:/usr/share/elasticsearch/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 1g
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { PROJECT: TicketFlow.Api }
    environment:
      <<: *backend-env
      Seed__Enabled: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:-}
    command: ["TicketFlow.Api.dll", "--migrate", "--seed"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { PROJECT: TicketFlow.Api }
    environment: *backend-env
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { PROJECT: TicketFlow.Worker }
    environment: *backend-env
    command: ["TicketFlow.Worker.dll"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { API_INTERNAL_URL: "http://api:8080" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  postgres-data:
  storage-data:
  search-data:
